<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemie-Quiz: Säuren</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .quiz-container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            padding: 30px;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .question {
            margin-bottom: 20px;
            display: none; /* Versteckt anfangs alle Fragen */
        }
        .question.active {
            display: block; /* Zeigt nur die aktuelle Frage */
        }
        .question h3 {
            font-size: 1.2em;
            margin-bottom: 15px;
            color: #34495e;
        }
        .options {
            list-style-type: none;
            padding: 0;
        }
        .options li {
            margin-bottom: 10px;
        }
        .options label {
            display: block;
            padding: 12px 15px;
            background-color: #e9ecef;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .options label:hover {
            background-color: #dee2e6;
        }
        input[type="radio"] {
            margin-right: 10px;
        }
        .btn {
            display: inline-block;
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .btn:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        #result-container {
            display: none;
            text-align: center;
            margin-top: 20px;
            padding: 20px;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .fail {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .secret-code {
            font-size: 1.5em;
            font-weight: bold;
            color: #e74c3c;
            margin-top: 15px;
            letter-spacing: 2px;
        }
        .progress {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>Säuren-Quiz</h1>
    <div id="progress" class="progress">Frage 1 von 7</div>
    <form id="quiz-form">
        <div id="quiz-body"></div>
        <div class="nav-buttons">
            <button type="button" id="prev-btn" class="btn" style="display:none;" onclick="prevQuestion()">Zurück</button>
            <button type="button" id="next-btn" class="btn" onclick="nextQuestion()">Weiter</button>
            <button type="submit" id="submit-btn" class="btn" style="display:none;">Quiz auswerten</button>
        </div>
    </form>
    
    <div id="result-container"></div>
    <button id="retry-btn" class="btn" style="display:none; margin-top: 15px;" onclick="location.reload()">Nochmal versuchen</button>
</div>

<script>
    const quizData = [
        {
            question: "1. Was findet man in jeder sauren Lösung?",
            correct: "Oxonium-Ionen (H₃O⁺)",
            incorrect: ["Sauerstoff-Atome", "Hydroxid-Ionen (OH⁻)", "ausschließlich Wasserstoff-Moleküle"]
        },
        {
            question: "2. Ein Stück Zink wird in verdünnte Salzsäure gegeben. Es sprudelt. Welches Gas entsteht?",
            correct: "Wasserstoff",
            incorrect: ["Sauerstoff", "Chlor", "Kohlenstoffdioxid"]
        },
        {
            question: "3. Du gibst Universalindikator in Zitronensaft. Welche Farbe zeigt sich?",
            correct: "rot",
            incorrect: ["blau", "grün", "violett"]
        },
        {
            question: "4. Salzsäure tropft auf ein Stück Marmor. Es schäumt stark. Welches Gas entweicht hier?",
            correct: "Kohlenstoffdioxid",
            incorrect: ["Wasserstoff", "Sauerstoff", "Wasserdampf"]
        },
        {
            question: "5. Salzsäure leitet den elektrischen Strom, reines Wasser fast nicht. Warum?",
            correct: "Weil in der sauren Lösung frei bewegliche Ionen vorliegen",
            incorrect: ["Weil Säuren Elektronen abgeben, die durch die Lösung wandern", "Weil Säuren immer Metalle enthalten", "Weil die Säure-Moleküle selbst den Strom weitertragen"]
        },
        {
            question: "6. Konzentrierte Schwefelsäure soll verdünnt werden. Wie gehst du vor?",
            correct: "Säure langsam ins Wasser gießen",
            incorrect: ["Wasser langsam in die Säure gießen", "Beides gleichzeitig zusammenschütten", "Die Säure vorher kühlen, dann Wasser darauf gießen"]
        },
        {
            question: "7. Welche Aussage über die ätzende Wirkung von Säuren ist richtig?",
            correct: "Ob eine saure Lösung ätzend wirkt, hängt auch von ihrer Konzentration ab",
            incorrect: ["Jede saure Lösung ist ätzend, egal wie stark sie verdünnt ist", "Säuren aus Lebensmitteln sind chemisch gesehen keine echten Säuren", "Nur Laborsäuren bilden Oxonium-Ionen, Speisesäuren nicht"]
        }
    ];

    let currentQuestionIndex = 0;
    const userAnswers = new Array(quizData.length).fill(null);

    // Mische ein Array (Fisher-Yates Shuffle)
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    const quizBody = document.getElementById("quiz-body");

    // Quiz aufbauen
    quizData.forEach((q, index) => {
        let options = [q.correct, ...q.incorrect];
        options = shuffle(options); // Antwortmöglichkeiten mischen

        const questionDiv = document.createElement("div");
        questionDiv.className = `question ${index === 0 ? 'active' : ''}`;
        questionDiv.id = `q${index}`;

        const questionTitle = document.createElement("h3");
        questionTitle.innerText = q.question;
        questionDiv.appendChild(questionTitle);

        const optionsList = document.createElement("ul");
        optionsList.className = "options";

        options.forEach((opt, optIndex) => {
            const li = document.createElement("li");
            const label = document.createElement("label");
            const radio = document.createElement("input");
            radio.type = "radio";
            radio.name = `question${index}`;
            radio.value = opt;
            radio.onchange = () => { userAnswers[index] = opt; };

            label.appendChild(radio);
            label.appendChild(document.createTextNode(" " + opt));
            li.appendChild(label);
            optionsList.appendChild(li);
        });

        questionDiv.appendChild(optionsList);
        quizBody.appendChild(questionDiv);
    });

    function updateNav() {
        document.getElementById("progress").innerText = `Frage ${currentQuestionIndex + 1} von ${quizData.length}`;
        
        // Verstecke alle Fragen
        document.querySelectorAll('.question').forEach((el, index) => {
            el.classList.remove('active');
            if(index === currentQuestionIndex) el.classList.add('active');
        });

        // Buttons steuern
        document.getElementById("prev-btn").style.display = currentQuestionIndex === 0 ? "none" : "block";
        
        if (currentQuestionIndex === quizData.length - 1) {
            document.getElementById("next-btn").style.display = "none";
            document.getElementById("submit-btn").style.display = "block";
        } else {
            document.getElementById("next-btn").style.display = "block";
            document.getElementById("submit-btn").style.display = "none";
        }
    }

    function nextQuestion() {
        if (currentQuestionIndex < quizData.length - 1) {
            currentQuestionIndex++;
            updateNav();
        }
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            updateNav();
        }
    }

    document.getElementById("quiz-form").addEventListener("submit", function(e) {
        e.preventDefault();
        
        // Prüfen ob alle Fragen beantwortet wurden
        if (userAnswers.includes(null)) {
            alert("Bitte beantworte alle Fragen, bevor du auswertest!");
            return;
        }

        let score = 0;
        quizData.forEach((q, index) => {
            if (userAnswers[index] === q.correct) {
                score++;
            }
        });

        const resultContainer = document.getElementById("result-container");
        resultContainer.style.display = "block";
        
        // Quiz verstecken
        document.getElementById("quiz-form").style.display = "none";
        document.getElementById("progress").style.display = "none";

        if (score === quizData.length) {
            resultContainer.className = "success";
            resultContainer.innerHTML = `
                <h2>Perfekt! ${score} von ${quizData.length} Punkten!</h2>
                <p>Du hast das Thema Säuren komplett verstanden.</p>
                <p>Dein Lösungswort lautet:</p>
                <div class="secret-code">SPRUDEL</div>
            `;
        } else {
            resultContainer.className = "fail";
            resultContainer.innerHTML = `
                <h2>Schade! ${score} von ${quizData.length} Punkten.</h2>
                <p>Das reicht leider noch nicht ganz für den Geheimcode. Lies dir die Fragen noch einmal genau durch.</p>
            `;
            document.getElementById("retry-btn").style.display = "block";
        }
    });
</script>

</body>
</html>
